<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>Lapor Harga - HargaPasar Aceh</title>
    <script src="js/main.js" defer></script>
    <script src="js/harga.js" defer></script>
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html" class="logo"><img src="assets/img/favicon.svg" alt="">HargaPasar <span>Aceh</span></a>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="lapor-harga.html">Lapor Harga</a>
            <a href="grafik.html">Grafik</a>
            <a href="perbandingan.html">Perbandingan</a>
            <a href="peringatan.html">Peringatan</a>
            <button onclick="logout()" class="btn-outline">Keluar</button>
        </div>
    </nav>

    <main class="page-center">
        <form class="form-card" id="laporanForm">
            <h2>Laporkan Harga 📝</h2>
            <p>Bagikan harga yang kamu temui di pasar. Terima kasih sudah membantu!</p>

            <label for="id_pasar">Pilih Pasar</label>
            <select id="id_pasar" required>
                <option value="">Memuat pasar...</option>
            </select>

            <label for="id_komoditas">Pilih Komoditas</label>
            <select id="id_komoditas" required>
                <option value="">Memuat komoditas...</option>
            </select>

            <label for="harga">Harga</label>
            <div class="input-prefix">
                <span>Rp</span>
                <input type="number" id="harga" min="1" placeholder="Contoh: 15000" required>
            </div>

            <button type="submit" class="btn-primary full">Kirim Laporan</button>

            <p id="laporanMessage" class="message"></p>
        </form>
    </main>
</body>
</html>
